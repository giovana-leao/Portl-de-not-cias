<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Notícias</title>
  <link rel="stylesheet" href="styles/index.css">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Poppins:wght@400;700&display=swap" rel="stylesheet">

</head>
<body>
  <header class="container" >
    <nav id="primary" class=" flex items-center py-base px-base gap-.5">
      <div>
        <img src="assets/icons/List.svg" alt="Ícone de Menu">
        <strong class="desktop-only">Menu</strong>
      </div>
      <div>
        <img class="logo"  src="assets/icons/logo.svg" alt="Logo Tech News">
      
      </div>
      <div>
        <strong class="desktop-only">Buscar</strong>
        <img src="assets/icons/MagnifyingGlass.svg" alt="Ícone de lupa">
      </div>
    </nav>
    <nav class="px-base even-columns" id="secondary">
      <a href="#">Inteligência Artificial</a>
      <a href="#">Blockchain</a>
      <a href="#">Hologramas</a>
      <a class="desktop-only" href="#">Internet</a>
      <a class="desktop-only" href="#">Vestíveis</a>
      <a class="desktop-only" href="#">Realidade Aumentada</a>
      <a class="desktop-only" href="#">Realidade  Virtual</a>
    </nav>
  </header>


  <main class="container grid py-base px-base">
    <section id="featured" class="grid gap-1" >
      <div class="card">
        <img src="assets/images/Image 01.png" alt="">
      </div>

      <div class="grid gap-1">
        <div>
          <img src="assets/images/Image 02.png" alt="Uma mão segura um celular iluminado em azul à noite, em um ambiente escuro pontuado por luzes coloridas desfocadas. A cena transmite uma atmosfera futurista e tecnológica.">
        </div>
        <div>

          <img src="assets/images/Image 03.png" alt="Tecnologia 6G chega às metrópoles brasileiras, prometendo revolucionar a forma como vivemos e nos comunicamos.">
        </div>

        <div>
          <img src="assets/images/Image 04.png" alt="Empresa lança relógio inteligente capaz de monitorar a saúde mental, oferecendo insights valiosos para o bem-estar pessoal.
          ">
        </div>
        <div>
          <img src="assets/images/Image 05.png" alt="Escolas adotam a tecnologia VR para proporcionar experiências imersivas, transformando a aprendizagem tradicional.">
        </div>
          
      </div>
    </section>
   
  </main>
</body>
</html>
